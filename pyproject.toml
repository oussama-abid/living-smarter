[project]
name = "living-smarter"
version = "0.2.0"
description = "LLM-powered voice assistant for smart homes: an orchestrator with specialized agents, built on Gemini."
requires-python = ">=3.12"
dependencies = [
    "google-generativeai",
    "python-dotenv",
    "pydantic",
    "instructor",
    "tavily-python",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "selenium",
    "webdriver-manager",
]

[project.optional-dependencies]
# Voice mode: microphone input and spoken answers (PyAudio needs PortAudio installed)
voice = [
    "deepgram-sdk>=3,<4",
    "pyaudio",
    "pygame",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Errors, pyflakes, import order, modern Python, common bugs
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long prompt strings are fine; the formatter handles code

[tool.ruff.lint.isort]
known-first-party = ["agents", "config", "db", "prompts", "speech_processing", "tools"]
